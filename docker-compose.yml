version: "3.9"

# ─────────────────────────────────────────────────────────────
#  FlowBoard — Full Microservices Stack
#  Start: docker-compose up -d
#  Eureka UI: http://localhost:8761
#  API:       http://localhost:8080/api/v1/...
# ─────────────────────────────────────────────────────────────

services:

  # ── MySQL (shared, separate DBs per service) ────────────────
  mysql:
    image: mysql:8.0
    container_name: flowboard-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_ROOT_HOST: '%'
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - flowboard-net

  # ── Eureka Discovery Server ──────────────────────────────────
  eureka-server:
    build: ./services/eureka-server
    container_name: flowboard-eureka
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - flowboard-net

  # ── API Gateway ──────────────────────────────────────────────
  api-gateway:
    build: ./services/api-gateway
    container_name: flowboard-gateway
    ports:
      - "8080:8080"
    environment:
      EUREKA_SERVER: http://eureka-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET}
      GATEWAY_SECRET: ${GATEWAY_SECRET}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - flowboard-net

  # ── Auth Service ─────────────────────────────────────────────
  auth-service:
    build: ./services/auth-service
    container_name: flowboard-auth
    environment:
      SERVER_PORT: 8081
      DB_URL: jdbc:mysql://mysql:3306/auth_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      GATEWAY_SECRET: ${GATEWAY_SECRET}
      EUREKA_SERVER: http://eureka-server:8761/eureka/
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - flowboard-net

  # ── Workspace Service ─────────────────────────────────────────
  workspace-service:
    build: ./services/workspace-service
    container_name: flowboard-workspace
    environment:
      SERVER_PORT: 8082
      DB_URL: jdbc:mysql://mysql:3306/workspace_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      GATEWAY_SECRET: ${GATEWAY_SECRET}
      EUREKA_SERVER: http://eureka-server:8761/eureka/
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - flowboard-net

  # ── Board Service ─────────────────────────────────────────────
  board-service:
    build: ./services/board-service
    container_name: flowboard-board
    environment:
      SERVER_PORT: 8083
      DB_URL: jdbc:mysql://mysql:3306/board_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      GATEWAY_SECRET: ${GATEWAY_SECRET}
      EUREKA_SERVER: http://eureka-server:8761/eureka/
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - flowboard-net

  # ── Column Service ────────────────────────────────────────────
  column-service:
    build: ./services/column-service
    container_name: flowboard-column
    environment:
      SERVER_PORT: 8084
      DB_URL: jdbc:mysql://mysql:3306/column_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      GATEWAY_SECRET: ${GATEWAY_SECRET}
      EUREKA_SERVER: http://eureka-server:8761/eureka/
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - flowboard-net

  # ── Card Service ──────────────────────────────────────────────
  card-service:
    build: ./services/card-service
    container_name: flowboard-card
    environment:
      SERVER_PORT: 8085
      DB_URL: jdbc:mysql://mysql:3306/card_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      GATEWAY_SECRET: ${GATEWAY_SECRET}
      EUREKA_SERVER: http://eureka-server:8761/eureka/
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - flowboard-net

  # ── Comment Service ───────────────────────────────────────────
  comment-service:
    build: ./services/comment-service
    container_name: flowboard-comment
    environment:
      SERVER_PORT: 8086
      DB_URL: jdbc:mysql://mysql:3306/comment_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      GATEWAY_SECRET: ${GATEWAY_SECRET}
      EUREKA_SERVER: http://eureka-server:8761/eureka/
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - flowboard-net

  # ── Checklist Service ─────────────────────────────────────────
  checklist-service:
    build: ./services/checklist-service
    container_name: flowboard-checklist
    environment:
      SERVER_PORT: 8087
      DB_URL: jdbc:mysql://mysql:3306/checklist_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      GATEWAY_SECRET: ${GATEWAY_SECRET}
      EUREKA_SERVER: http://eureka-server:8761/eureka/
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - flowboard-net

  # ── Notification Service ──────────────────────────────────────
  notification-service:
    build: ./services/notification-service
    container_name: flowboard-notification
    environment:
      SERVER_PORT: 8088
      DB_URL: jdbc:mysql://mysql:3306/notification_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      GATEWAY_SECRET: ${GATEWAY_SECRET}
      EUREKA_SERVER: http://eureka-server:8761/eureka/
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_AUTH: ${MAIL_AUTH}
      MAIL_STARTTLS: ${MAIL_STARTTLS}
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - flowboard-net

volumes:
  mysql_data:

networks:
  flowboard-net:
    driver: bridge
