  Content-Type: application/json
body:
  mode: raw
  raw: |
    {
      "fullName": "John Doe",
      "email": "john.doe@example.com",
      "userName": "johndoe",
      "password": "password123",
      "role": "USER",
      "provider": "LOCAL",
      "isActive": true
    }
