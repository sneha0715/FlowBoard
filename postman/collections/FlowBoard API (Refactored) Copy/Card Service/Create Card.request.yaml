$kind: http-request
url: "{{base_url}}/cards"
method: POST
headers:
  Authorization: Bearer {{token}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
        "columnId": 1,
        "title": "New Card",
        "description": "Card details",
        "position": 1
    }
order: 1000
