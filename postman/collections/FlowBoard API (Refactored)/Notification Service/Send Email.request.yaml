$kind: http-request
url: "{{base_url}}/notifications/email"
method: POST
headers:
  Authorization: Bearer {{token}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
        "recipientEmail": "user@example.com",
        "subject": "Notification",
        "body": "Hello World"
    }
order: 10000
