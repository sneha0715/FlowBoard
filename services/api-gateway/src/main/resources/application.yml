server:
  port: ${GATEWAY_PORT:8080}

spring:
  application:
    name: api-gateway
  main:
    banner-mode: off
    web-application-type: reactive
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origins:
              - http://localhost:3000
              - http://localhost:4200
              - http://localhost:5173
            allowed-methods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - PATCH
            allowed-headers: "*"
            allow-credentials: false
            max-age: 3600
      routes:
        # ── PUBLIC Auth routes (no AuthenticationFilter) ──────────────────────
        - id: auth-service-public
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/auth/login,/api/v1/auth/register
          filters:
            - StripPrefix=2

        # ── SECURED Auth routes ────────────────────────────────────────────────
        - id: auth-service-secured
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - name: AuthenticationFilter
            - StripPrefix=2

        # ── Workspace Service ──────────────────────────────────────────────────
        - id: workspace-service
          uri: lb://workspace-service
          predicates:
            - Path=/api/v1/workspaces/**
          filters:
            - name: AuthenticationFilter
            - StripPrefix=2

        # ── Board Service ──────────────────────────────────────────────────────
        - id: board-service
          uri: lb://board-service
          predicates:
            - Path=/api/v1/boards/**
          filters:
            - name: AuthenticationFilter
            - StripPrefix=2

        # ── Column Service ─────────────────────────────────────────────────────
        - id: column-service
          uri: lb://column-service
          predicates:
            - Path=/api/v1/columns/**
          filters:
            - name: AuthenticationFilter
            - StripPrefix=2

        # ── Card Service ───────────────────────────────────────────────────────
        - id: card-service
          uri: lb://card-service
          predicates:
            - Path=/api/v1/cards/**
          filters:
            - name: AuthenticationFilter
            - StripPrefix=2

        # ── Comment Service ────────────────────────────────────────────────────
        - id: comment-service
          uri: lb://comment-service
          predicates:
            - Path=/api/v1/comments/**
          filters:
            - name: AuthenticationFilter
            - StripPrefix=2


        # ── Attachment Service (part of comment-service) ───────────────────────
        - id: attachment-service
          uri: lb://comment-service
          predicates:
            - Path=/api/v1/attachments/**
          filters:
            - name: AuthenticationFilter
            - StripPrefix=2

        # ── Checklist Service ──────────────────────────────────────────────────
        - id: checklist-service
          uri: lb://checklist-service
          predicates:
            - Path=/api/v1/checklists/**
          filters:
            - name: AuthenticationFilter
            - StripPrefix=2


        # ── Label Service (part of checklist-service) ─────────────────────────
        - id: label-service
          uri: lb://checklist-service
          predicates:
            - Path=/api/v1/labels/**
          filters:
            - name: AuthenticationFilter
            - StripPrefix=2

        # ── Notification Service ───────────────────────────────────────────────
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/v1/notifications/**
          filters:
            - name: AuthenticationFilter
            - StripPrefix=2

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_SERVER:http://localhost:8761/eureka/}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: false
    hostname: localhost

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
