spring.config.import=optional:file:.env[.properties],optional:file:services/column-service/.env[.properties]
spring.application.name=column-service
server.port=${SERVER_PORT:8084}

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/column_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Gateway secret
gateway.secret=${GATEWAY_SECRET:FlowBoardGateway2024}

# Eureka
eureka.client.serviceUrl.defaultZone=${EUREKA_SERVER:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=false
eureka.instance.hostname=localhost

# Jackson — ISO-8601 dates
spring.jackson.serialization.write-dates-as-timestamps=false

# Error handling
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false
spring.main.banner-mode=off

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
