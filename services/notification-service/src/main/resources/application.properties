spring.config.import=optional:file:.env[.properties],optional:file:services/notification-service/.env[.properties]
spring.application.name=notification-service

# Database Configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.dialect=${DIALECT:org.hibernate.dialect.MySQLDialect}

# Server Configuration
server.port=${SERVER_PORT:8088}

# JWT Configuration
jwt.secret=${JWT_SECRET}

# Mail Configuration
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=${MAIL_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
spring.mail.protocol=${MAIL_PROTOCOL:smtp}

logging.level.com.flowboard=DEBUG
