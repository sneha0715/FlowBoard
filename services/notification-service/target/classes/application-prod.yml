spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: ${JPA_SHOW_SQL:false}
  mail:
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}

gateway:
  secret: ${INTERNAL_GATEWAY_SECRET}

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_SERVER}
  instance:
    prefer-ip-address: true
